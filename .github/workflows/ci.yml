name: Go CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go (from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Unit & Integration Tests
        run: go test -v ./...

      - name: Build Binary
        run: go build -v -o api-bin cmd/api/main.go

  security-scan:
    name: Security & Linting
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: -exclude-dir=cmd/qa ./...

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

  nullplatform-deploy:
    name: Nullplatform Build & Release
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' # Solo desplegar si se hizo merge a master

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Opcional, si Nullplatform lo requiere)
        # uses: aws-actions/configure-aws-credentials@v4 ...
        run: echo "Configuring AWS or generic auth if needed"

      - name: Nullplatform Build
        uses: nullplatform/github-action-build@v1
        with:
          api-key: ${{ secrets.NULLPLATFORM_API_KEY }}
          app-id: api-bfcl-mortgage-loans-injection

      - name: Nullplatform Release (Deploy to QA/Dev)
        uses: nullplatform/github-action-release@v1
        with:
          api-key: ${{ secrets.NULLPLATFORM_API_KEY }}
          app-id: api-bfcl-mortgage-loans-injection
          env: qa # Puedes cambiar esto o parametrizarlo
